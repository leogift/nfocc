<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760"><rect width="1180" height="760" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456"/></marker></defs><text x="30" y="38" font-size="22" fill="#1a2b3c" text-anchor="start" font-weight="600">NFOCC 开发进展看板</text><text x="30" y="60" font-size="13" fill="#667" text-anchor="start">2026-11-02  ·  代码 7900 行  ·  ctest 17/18  ·  文档 40 篇全绿</text><rect x="780" y="24" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="800" y="36" font-size="12" fill="#445" text-anchor="start">已完成</text><rect x="875" y="24" width="14" height="14" rx="3" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="895" y="36" font-size="12" fill="#445" text-anchor="start">部分</text><rect x="970" y="24" width="14" height="14" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="990" y="36" font-size="12" fill="#445" text-anchor="start">未做</text><rect x="30" y="90" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="112" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">相机模型</text><text x="44" y="132" font-size="11.5" fill="#556" text-anchor="start">KB + 径向多项式，vcam 桥接 0.117/0.190 px 对齐</text><rect x="30" y="156" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="178" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">视口 LUT</text><text x="44" y="198" font-size="11.5" fill="#556" text-anchor="start">6 视口，左右 150°×1024 / 前后 90°×590，四道淘汰计数</text><rect x="30" y="222" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="244" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">SGBM 视差</text><text x="44" y="264" font-size="11.5" fill="#556" text-anchor="start">已接主链，35.6 ms/帧（单相机串行）</text><rect x="30" y="288" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="310" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">前向径向测距</text><text x="44" y="330" font-size="11.5" fill="#556" text-anchor="start">解析解，误差 0.000 mm（合成验证）</text><rect x="30" y="354" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="376" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">三角化 / 体素</text><text x="44" y="396" font-size="11.5" fill="#556" text-anchor="start">Hash + CMA，RSS 162 MB（预算 291 MB）</text><rect x="30" y="420" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="442" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">车身掩码 D1</text><text x="44" y="462" font-size="11.5" fill="#556" text-anchor="start">5000×2000 矩形占位，负对照 661→195 点</text><rect x="30" y="486" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="508" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">FoE 锥过滤 D3</text><text x="44" y="528" font-size="11.5" fill="#556" text-anchor="start">已接主链，pipeline 两处调用</text><rect x="30" y="552" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="574" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">σ 传播 / 落库</text><text x="44" y="594" font-size="11.5" fill="#556" text-anchor="start">已接主链，σ<10cm 占 66%</text><rect x="30" y="618" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="640" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">ZMQ 零拷贝</text><text x="44" y="660" font-size="11.5" fill="#556" text-anchor="start">接收零拷贝 + 发送所有权转移，8 用例</text><rect x="30" y="684" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="44" y="706" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">网格哈希 + DBSCAN</text><text x="44" y="726" font-size="11.5" fill="#556" text-anchor="start">150k 点 45 ms（纯网格哈希）</text><rect x="615" y="90" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="629" y="112" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">动静分离</text><text x="629" y="132" font-size="11.5" fill="#556" text-anchor="start">位姿补偿 + 点级速度 + 簇级投票，负对照守住</text><rect x="615" y="156" width="545" height="58" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="629" y="178" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">双基线状态机</text><text x="629" y="198" font-size="11.5" fill="#556" text-anchor="start">6 用例通过，但 pipeline 仍用旧门控</text><rect x="615" y="222" width="545" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="629" y="244" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">里程计积分</text><text x="629" y="264" font-size="11.5" fill="#556" text-anchor="start">speed+yaw_rate 中点航向法，圆弧误差 0.05%</text><rect x="615" y="288" width="545" height="58" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="629" y="310" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">D2 双向一致性</text><text x="629" y="330" font-size="11.5" fill="#556" text-anchor="start">函数在，主链 0 处调用（耗时 1.8 倍）</text><rect x="615" y="354" width="545" height="58" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="629" y="376" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">D4 交叉验证</text><text x="629" y="396" font-size="11.5" fill="#556" text-anchor="start">函数在，需双基线晋升 / 真实定位</text><rect x="615" y="420" width="545" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="629" y="442" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">在线自校准</text><text x="629" y="462" font-size="11.5" fill="#556" text-anchor="start">方案已定（地平面单应 + IMU），未实现</text><rect x="615" y="486" width="545" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="629" y="508" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">精度达标 150mm@5m</text><text x="629" y="528" font-size="11.5" fill="#556" text-anchor="start">需 σ_d≤0.34px，实测 14-42px，未证实</text><rect x="615" y="552" width="545" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="629" y="574" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">aarch64 上板</text><text x="629" y="594" font-size="11.5" fill="#556" text-anchor="start">产物已出，未在 RK3588/M57 运行</text><rect x="615" y="618" width="545" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="629" y="640" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">Neon/SIMD 优化</text><text x="629" y="660" font-size="11.5" fill="#556" text-anchor="start">全库无 SIMD 代码</text><rect x="615" y="684" width="545" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="629" y="706" font-size="14" fill="#1a2b3c" text-anchor="start" font-weight="600">RKNN 模型后端</text><text x="629" y="726" font-size="11.5" fill="#556" text-anchor="start">onnxruntime 通，NPU 未接</text><text x="30" y="744" font-size="11.5" fill="#777" text-anchor="start">「部分」= 代码已实现并通过单测，但主链未接入或依赖缺失的外部数据。这类最容易被误报为完成。</text></svg>