<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"><rect width="1200" height="500" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#456"/></marker></defs><text x="30" y="36" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">图 7  已知局限与风险</text><text x="30" y="58" font-size="12" fill="#667" text-anchor="start">按「影响程度 × 是否已有对策」排列</text><rect x="30" y="86" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="86" width="5" height="50" rx="2" fill="#c62828"/><text x="48" y="107" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">精度未验证</text><text x="48" y="125" font-size="10.5" fill="#c62828" text-anchor="start">影响 高 · 对策 无</text><text x="300" y="107" font-size="11" fill="#445" text-anchor="start">唯一测精度的用例失败，原因是场景不是算法；150mm@5m 未被证实</text><rect x="30" y="142" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="142" width="5" height="50" rx="2" fill="#c62828"/><text x="48" y="163" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">点密度不足</text><text x="48" y="181" font-size="10.5" fill="#c62828" text-anchor="start">影响 高 · 对策 无</text><text x="300" y="163" font-size="11" fill="#445" text-anchor="start">真实数据 195 点/帧，聚类聚出 82 簇每簇 4 点，无实用价值</text><rect x="30" y="198" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="198" width="5" height="50" rx="2" fill="#e65100"/><text x="48" y="219" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">车身掩码粗略</text><text x="48" y="237" font-size="10.5" fill="#e65100" text-anchor="start">影响 中 · 对策 部分</text><text x="300" y="219" font-size="11" fill="#445" text-anchor="start">矩形占位投影，侧视相机挖掉 77% 画面；应由标定式视图掩码替代</text><rect x="30" y="254" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="254" width="5" height="50" rx="2" fill="#e65100"/><text x="48" y="275" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">无自车运动真值</text><text x="48" y="293" font-size="10.5" fill="#e65100" text-anchor="start">影响 中 · 对策 部分</text><text x="300" y="275" font-size="11" fill="#445" text-anchor="start">数据集无速度/航向，D4 只能靠 CLI 传入</text><rect x="30" y="310" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="310" width="5" height="50" rx="2" fill="#e65100"/><text x="48" y="331" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">D2 未接入</text><text x="48" y="349" font-size="10.5" fill="#e65100" text-anchor="start">影响 中 · 对策 有方案</text><text x="300" y="331" font-size="11" fill="#445" text-anchor="start">双向一致性函数已实现，主链未接；遮挡断裂带误配无防护</text><rect x="30" y="366" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="366" width="5" height="50" rx="2" fill="#889"/><text x="48" y="387" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">薄障碍物漏检</text><text x="48" y="405" font-size="10.5" fill="#889" text-anchor="start">影响 低 · 对策 有</text><text x="300" y="387" font-size="11" fill="#445" text-anchor="start">720 扇区在 5m 处弧宽 44mm，<50mm 立柱依赖其他传感器</text><rect x="30" y="422" width="1140" height="50" rx="5" fill="#fff" stroke="#e0e6ec" stroke-width="1"/><rect x="30" y="422" width="5" height="50" rx="2" fill="#c62828"/><text x="48" y="443" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">真机未验证</text><text x="48" y="461" font-size="10.5" fill="#c62828" text-anchor="start">影响 高 · 对策 无</text><text x="300" y="443" font-size="11" fill="#445" text-anchor="start">aarch64 产物已出，未在 RK3588 / M57 上运行</text></svg>