<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><rect width="1200" height="620" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#456"/></marker></defs><text x="30" y="36" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">图 6  算法逻辑</text><text x="30" y="66" font-size="14" fill="#4a5a6b" text-anchor="start" font-weight="600">测距两条路径（按运动方向自动选择）</text><rect x="24" y="82" width="560" height="240" rx="8" fill="#eef4fb" stroke="#9cc" stroke-width="1.2"/><text x="42" y="106" font-size="13" fill="#1e5a96" text-anchor="start" font-weight="600">A. 侧向：三角化</text><rect x="42" y="126" width="220" height="40" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="152.0" y="138.0" font-size="11.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">左右视口成对匹配</text><text x="152.0" y="153.0" font-size="9.0" fill="#556" text-anchor="middle">同一帧，两路相机</text><line x1="152" y1="168" x2="152" y2="172" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><rect x="42" y="174" width="220" height="40" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="152.0" y="186.0" font-size="11.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">SGBM 视差 d</text><text x="152.0" y="201.0" font-size="9.0" fill="#556" text-anchor="middle">f·b / Z</text><line x1="152" y1="216" x2="152" y2="220" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><rect x="42" y="222" width="220" height="40" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="152.0" y="234.0" font-size="11.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">射线最小二乘</text><text x="152.0" y="249.0" font-size="9.0" fill="#556" text-anchor="middle">闭式解，float32 稳定</text><line x1="152" y1="264" x2="152" y2="268" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><rect x="42" y="270" width="220" height="40" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="152.0" y="282.0" font-size="11.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">3D 点 P</text><text x="152.0" y="297.0" font-size="9.0" fill="#556" text-anchor="middle">车体系，ISO 8855</text><text x="280" y="150" font-size="11" fill="#556" text-anchor="start" font-weight="600">精度</text><text x="280" y="168" font-size="11" fill="#334" text-anchor="start">σ 与 1/Z² 成正比</text><text x="280" y="186" font-size="11" fill="#c62828" text-anchor="start">80cm@8m</text><text x="280" y="212" font-size="10.5" fill="#667" text-anchor="start">依赖：基线足够长</text><text x="280" y="228" font-size="10.5" fill="#667" text-anchor="start">b=278/500/833mm</text><rect x="600" y="82" width="576" height="240" rx="8" fill="#e6f2ea" stroke="#8c8" stroke-width="1.2"/><text x="618" y="106" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="600">B. 前向：径向膨胀解析测距</text><rect x="618" y="126" width="260" height="40" rx="5" fill="#fff" stroke="#4a9a5a" stroke-width="1.5"/><text x="748.0" y="138.0" font-size="11" fill="#1a2b3c" text-anchor="middle" font-weight="600">连续两帧同一相机</text><text x="748.0" y="153.0" font-size="8.5" fill="#556" text-anchor="middle">自车前进，视野径向膨胀</text><line x1="748" y1="168" x2="748" y2="172" stroke="#4a9a5a" stroke-width="1.8" marker-end="url(#a)"/><rect x="618" y="174" width="260" height="40" rx="5" fill="#fff" stroke="#4a9a5a" stroke-width="1.5"/><text x="748.0" y="186.0" font-size="11" fill="#1a2b3c" text-anchor="middle" font-weight="600">径向位移场 u → v</text><text x="748.0" y="201.0" font-size="8.5" fill="#556" text-anchor="middle">无对应点搜索</text><line x1="748" y1="216" x2="748" y2="220" stroke="#4a9a5a" stroke-width="1.8" marker-end="url(#a)"/><rect x="618" y="222" width="260" height="40" rx="5" fill="#fff" stroke="#4a9a5a" stroke-width="1.5"/><text x="748.0" y="234.0" font-size="11" fill="#1a2b3c" text-anchor="middle" font-weight="600">解析解 Z = Σ((u×v)·(t×v)) / Σ‖u×v‖²</text><text x="748.0" y="249.0" font-size="8.5" fill="#556" text-anchor="middle">闭式，无迭代</text><line x1="748" y1="264" x2="748" y2="268" stroke="#4a9a5a" stroke-width="1.8" marker-end="url(#a)"/><rect x="618" y="270" width="260" height="40" rx="5" fill="#fff" stroke="#4a9a5a" stroke-width="1.5"/><text x="748.0" y="282.0" font-size="11" fill="#1a2b3c" text-anchor="middle" font-weight="600">3D 点 P</text><text x="748.0" y="297.0" font-size="8.5" fill="#556" text-anchor="middle">前单向，覆盖 5m</text><text x="896" y="150" font-size="11" fill="#556" text-anchor="start" font-weight="600">优势</text><text x="896" y="168" font-size="11" fill="#334" text-anchor="start">纯前向平移下 SGBM</text><text x="896" y="184" font-size="11" fill="#334" text-anchor="start">结构性失效（像移翻转）</text><text x="896" y="206" font-size="10.5" fill="#667" text-anchor="start">合成验证</text><text x="896" y="222" font-size="10.5" fill="#2e7d32" text-anchor="start">误差 0.000 mm</text><text x="30" y="356" font-size="14" fill="#4a5a6b" text-anchor="start" font-weight="600">REV-003 五阶段稠密体素精简（15 万点 → 1.06 ms）</text><rect x="30" y="376" width="215" height="86" rx="6" fill="#fdf3e7" stroke="#d0a060" stroke-width="1.3"/><text x="137" y="398" font-size="11.5" fill="#7a4a10" text-anchor="middle" font-weight="600">① AABB + FoE 锥</text><text x="137" y="418" font-size="10" fill="#666" text-anchor="middle">点积代数</text><text x="137" y="432" font-size="10" fill="#666" text-anchor="middle">无开方无三角函数</text><text x="137" y="454" font-size="10.5" fill="#1e5a96" text-anchor="middle" font-weight="600">15万</text><line x1="247" y1="419" x2="259" y2="419" stroke="#d0a060" stroke-width="1.8" marker-end="url(#a)"/><rect x="263" y="376" width="215" height="86" rx="6" fill="#fdf3e7" stroke="#d0a060" stroke-width="1.3"/><text x="370" y="398" font-size="11.5" fill="#7a4a10" text-anchor="middle" font-weight="600">② 2D 柱体位图</text><text x="370" y="418" font-size="10" fill="#666" text-anchor="middle">每 cell 1 个 uint32</text><text x="370" y="432" font-size="10" fill="#666" text-anchor="middle">记 32 层</text><text x="370" y="454" font-size="10.5" fill="#1e5a96" text-anchor="middle" font-weight="600">15万</text><line x1="480" y1="419" x2="492" y2="419" stroke="#d0a060" stroke-width="1.8" marker-end="url(#a)"/><rect x="496" y="376" width="215" height="86" rx="6" fill="#fdf3e7" stroke="#d0a060" stroke-width="1.3"/><text x="603" y="398" font-size="11.5" fill="#7a4a10" text-anchor="middle" font-weight="600">③ 位运算地面剥离</text><text x="603" y="418" font-size="10" fill="#666" text-anchor="middle">CTZ32 找最低层</text><text x="603" y="432" font-size="10" fill="#666" text-anchor="middle">保护孤立单层地锁</text><text x="603" y="454" font-size="10.5" fill="#1e5a96" text-anchor="middle" font-weight="600">→13万</text><line x1="713" y1="419" x2="725" y2="419" stroke="#d0a060" stroke-width="1.8" marker-end="url(#a)"/><rect x="729" y="376" width="215" height="86" rx="6" fill="#fdf3e7" stroke="#d0a060" stroke-width="1.3"/><text x="836" y="398" font-size="11.5" fill="#7a4a10" text-anchor="middle" font-weight="600">④ 极坐标首击外壳</text><text x="836" y="418" font-size="10" fill="#666" text-anchor="middle">720 扇区</text><text x="836" y="432" font-size="10" fill="#666" text-anchor="middle">30cm 壳厚</text><text x="836" y="454" font-size="10.5" fill="#1e5a96" text-anchor="middle" font-weight="600">→8千</text><line x1="946" y1="419" x2="958" y2="419" stroke="#d0a060" stroke-width="1.8" marker-end="url(#a)"/><rect x="962" y="376" width="215" height="86" rx="6" fill="#fdf3e7" stroke="#d0a060" stroke-width="1.3"/><text x="1069" y="398" font-size="11.5" fill="#7a4a10" text-anchor="middle" font-weight="600">⑤ 配额 + 计数排序</text><text x="1069" y="418" font-size="10" fill="#666" text-anchor="middle">近场优先</text><text x="1069" y="432" font-size="10" fill="#666" text-anchor="middle">≤15000 点</text><text x="1069" y="454" font-size="10.5" fill="#1e5a96" text-anchor="middle" font-weight="600">→2070</text><rect x="30" y="486" width="1140" height="110" rx="8" fill="#fff5f5" stroke="#e09090" stroke-width="1.2"/><text x="48" y="510" font-size="12.5" fill="#a03030" text-anchor="start" font-weight="600">实现中修掉的三个「能跑但结果错」的 bug</text><text x="48" y="534" font-size="10.5" fill="#803030" text-anchor="start">① 外壳过滤用 continue 跳过点时没清 keep —— zindex 末位 100 但实际只写 86 个点，下游读到未初始化槽位</text><text x="48" y="553" font-size="10.5" fill="#803030" text-anchor="start">② 地面剥离后只判「cell 位图非零」不够 —— 地面点与障碍物同 cell，剥离后位图仍非零，地面点被漏放</text><text x="48" y="572" font-size="10.5" fill="#803030" text-anchor="start">③ zmap 直接 memcpy 会带进「层在位图里但点全被剔掉」的情况 —— 改为从最终 keep 重新 OR</text></svg>