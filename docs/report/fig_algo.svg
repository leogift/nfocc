<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"><rect width="1180" height="640" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456"/></marker></defs><text x="30" y="34" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">算法逻辑：从鱼眼像素到体素</text><text x="30" y="72" font-size="14" fill="#2a5d8f" text-anchor="start" font-weight="600">① 视口投影（虚拟相机）</text><rect x="30" y="88" width="300" height="120" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="180.0" y="148.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600"></text><text x="48" y="114" font-size="11.5" fill="#334" text-anchor="start">视口像素 (u,v)</text><text x="48" y="132" font-size="11.5" fill="#334" text-anchor="start">→ 视口系射线 d_view</text><text x="48" y="150" font-size="11.5" fill="#334" text-anchor="start">→ 车体系 d_veh = R_view · d_view</text><text x="48" y="168" font-size="11.5" fill="#334" text-anchor="start">→ 相机系 d_cam = R_camᵀ · d_veh</text><text x="48" y="186" font-size="11.5" fill="#334" text-anchor="start">→ 鱼眼投影 (u_fish, v_fish)</text><text x="48" y="204" font-size="11.5" fill="#334" text-anchor="start">→ 查表得原图坐标 + 有效性</text><text x="360" y="72" font-size="14" fill="#2a5d8f" text-anchor="start" font-weight="600">② 三角化（射线最小二乘）</text><rect x="360" y="88" width="340" height="120" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="530.0" y="148.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600"></text><text x="378" y="114" font-size="11.5" fill="#334" text-anchor="start">当前帧射线 u_hat（相机系）</text><text x="378" y="134" font-size="11.5" fill="#334" text-anchor="start">参考帧射线 v_hat + 基线 t</text><text x="378" y="154" font-size="11.5" fill="#334" text-anchor="start">Z = Σ((u×v)·(t×v)) / Σ‖u×v‖²</text><text x="378" y="174" font-size="11.5" fill="#334" text-anchor="start">粗差判据：残差 > τ 则剔除</text><text x="378" y="194" font-size="11.5" fill="#334" text-anchor="start">前向平移时改用径向膨胀解析解</text><text x="730" y="72" font-size="14" fill="#2a5d8f" text-anchor="start" font-weight="600">③ 体素融合</text><rect x="730" y="88" width="420" height="120" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="940.0" y="148.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600"></text><text x="748" y="114" font-size="11.5" fill="#334" text-anchor="start">体素索引 (ix,iy,iz) = floor(p / 200mm)</text><text x="748" y="134" font-size="11.5" fill="#334" text-anchor="start">哈希表开放寻址，空槽探测</text><text x="748" y="154" font-size="11.5" fill="#334" text-anchor="start">CMA 更新：存在概率 p ← p·(1-w) + w</text><text x="748" y="174" font-size="11.5" fill="#334" text-anchor="start">σ 传播：深度误差 → 空间不确定度 (cm)</text><text x="748" y="194" font-size="11.5" fill="#334" text-anchor="start">同体素多次观测取加权质心</text><text x="30" y="258" font-size="14" fill="#2a5d8f" text-anchor="start" font-weight="600">④ 聚类与动静分离</text><rect x="30" y="274" width="270" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="165" y="298" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">网格哈希</text><text x="165" y="316" font-size="11" fill="#556" text-anchor="middle">格子 (ix,iy,iz)</text><text x="165" y="330" font-size="11" fill="#556" text-anchor="middle">→ 点列表 CSR</text><line x1="302" y1="307" x2="318" y2="307" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ar)"/><rect x="320" y="274" width="270" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="455" y="298" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">DBSCAN</text><text x="455" y="316" font-size="11" fill="#556" text-anchor="middle">eps=120mm</text><text x="455" y="330" font-size="11" fill="#556" text-anchor="middle">minPts=3</text><line x1="592" y1="307" x2="608" y2="307" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ar)"/><rect x="610" y="274" width="270" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="745" y="298" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">点级速度</text><text x="745" y="316" font-size="11" fill="#556" text-anchor="middle">本帧→上帧</text><text x="745" y="330" font-size="11" fill="#556" text-anchor="middle">最近邻位移/dt</text><line x1="882" y1="307" x2="898" y2="307" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ar)"/><rect x="900" y="274" width="270" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="1035" y="298" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">簇级投票</text><text x="1035" y="316" font-size="11" fill="#556" text-anchor="middle">动态点占比</text><text x="1035" y="330" font-size="11" fill="#556" text-anchor="middle">> 50% 判动态</text><text x="30" y="392" font-size="14" fill="#5a6b7d" text-anchor="start" font-weight="600">实测精度（合成场景，5 km/h，b=278mm）</text><rect x="30" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="117" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">前 -45°</text><text x="117" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">41.6 px</text><rect x="220" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="307" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">前 +45°</text><text x="307" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">28.9 px</text><rect x="410" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="497" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">后 -135°</text><text x="497" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">27.6 px</text><rect x="600" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="687" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">后 +135°</text><text x="687" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">15.1 px</text><rect x="790" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="877" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">左 90°</text><text x="877" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">15.3 px</text><rect x="980" y="408" width="175" height="46" rx="5" fill="#fdf3e7" stroke="#e0a060" stroke-width="1.2"/><text x="1067" y="428" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">右 -90°</text><text x="1067" y="446" font-size="11.5" fill="#a05000" text-anchor="middle">14.1 px</text><text x="30" y="476" font-size="11.5" fill="#a05000" text-anchor="start">判据 0.6 px，实测差 20-70 倍。但这是**纹理伪影**不是算法能力 ——规则周期纹理让 SGBM 锁错周期，见 PROBE-RESULTS.md。</text><rect x="30" y="496" width="1120" height="120" rx="8" fill="#f0f7ff" stroke="#9cc" stroke-width="1.2"/><text x="48" y="520" font-size="13" fill="#2a5d8f" text-anchor="start" font-weight="600">关键约定（易错点）</text><text x="48" y="544" font-size="11.5" fill="#1a3d5f" text-anchor="start">· 环带角是**绝对俯角**：hanqtech MVL 光轴下俯 74°，当相对角处理会看到 0.43 m 地面而非 1-4 m</text><text x="48" y="561" font-size="11.5" fill="#1a3d5f" text-anchor="start">· 位姿补偿方向：P_prev = Rᵀ·P_cur + t（不是减 t）。负对照守住：不给位姿时静止墙报 3080 mm/s</text><text x="48" y="578" font-size="11.5" fill="#1a3d5f" text-anchor="start">· SGBM 输出恒为正：反向视差不能取负，符号在引擎层已丢</text><text x="48" y="595" font-size="11.5" fill="#1a3d5f" text-anchor="start">· 车身掩码按原图像素索引，尺寸必须与实际图像一致（曾硬编 1920 而实际 1280，stride 全错）</text></svg>