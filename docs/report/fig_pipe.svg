<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700"><rect width="1180" height="700" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456"/></marker></defs><text x="30" y="34" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">数据流 Pipeline（单帧 200 ms 预算）</text><rect x="30" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="110.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">输入</text><text x="110" y="122" font-size="11" fill="#556" text-anchor="middle">4 路 Y 通道</text><text x="110" y="136" font-size="11" fill="#556" text-anchor="middle">1280×966</text><rect x="210" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="290.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">视口投影</text><text x="290" y="122" font-size="11" fill="#556" text-anchor="middle">LUT 构建</text><text x="290" y="136" font-size="11" fill="#556" text-anchor="middle">6 视口</text><rect x="390" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="470.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">视差匹配</text><text x="470" y="122" font-size="11" fill="#556" text-anchor="middle">SGBM</text><text x="470" y="136" font-size="11" fill="#556" text-anchor="middle">35.6 ms/相机</text><rect x="570" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="650.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">三角化</text><text x="650" y="122" font-size="11" fill="#556" text-anchor="middle">射线最小二乘</text><text x="650" y="136" font-size="11" fill="#556" text-anchor="middle">或前向解析</text><rect x="750" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="830.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">体素融合</text><text x="830" y="122" font-size="11" fill="#556" text-anchor="middle">Hash + CMA</text><text x="830" y="136" font-size="11" fill="#556" text-anchor="middle">σ 落库</text><rect x="930" y="80" width="160" height="66" rx="5" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.5"/><text x="1010.0" y="113.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">输出</text><text x="1010" y="122" font-size="11" fill="#556" text-anchor="middle">点云 + zMap</text><text x="1010" y="136" font-size="11" fill="#556" text-anchor="middle">冻结也发</text><line x1="192" y1="113" x2="208" y2="113" stroke="#456" stroke-width="1.8" marker-end="url(#ar)"/><line x1="372" y1="113" x2="388" y2="113" stroke="#456" stroke-width="1.8" marker-end="url(#ar)"/><line x1="552" y1="113" x2="568" y2="113" stroke="#456" stroke-width="1.8" marker-end="url(#ar)"/><line x1="732" y1="113" x2="748" y2="113" stroke="#456" stroke-width="1.8" marker-end="url(#ar)"/><line x1="912" y1="113" x2="928" y2="113" stroke="#456" stroke-width="1.8" marker-end="url(#ar)"/><text x="30" y="205" font-size="14" fill="#5a6b7d" text-anchor="start" font-weight="600">防御层（主链旁路，按状态开关）</text><rect x="30" y="225" width="210" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="135" y="248" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">D1 车身掩码</text><text x="135" y="266" font-size="11" fill="#556" text-anchor="middle">LUT 构建期剔除</text><text x="135" y="280" font-size="11" fill="#556" text-anchor="middle">已接入</text><rect x="256" y="225" width="210" height="64" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="361" y="248" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">D2 双向一致性</text><text x="361" y="266" font-size="11" 