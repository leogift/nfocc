<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><rect width="1200" height="640" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#456"/></marker></defs><text x="30" y="36" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">图 2  单帧数据流 Pipeline</text><text x="30" y="58" font-size="12" fill="#667" text-anchor="start">实测 34.0 ms/帧（hanqtech 帧 164，3 帧平均），预算 200 ms</text><rect x="30" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="110.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">① 输入</text><text x="110.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">4 路 Y 通道</text><text x="110.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">1280×966</text><rect x="226" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="306.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">② 视口投影</text><text x="306.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">LUT 重采样</text><text x="306.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">6 个虚拟相机</text><rect x="422" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="502.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">③ 视差匹配</text><text x="502.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">SGBM</text><text x="502.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">需两帧</text><rect x="618" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="698.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">④ 三角化</text><text x="698.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">射线最小二乘</text><text x="698.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">或径向解析</text><rect x="814" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="894.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">⑤ 体素融合</text><text x="894.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">Hash + CMA</text><text x="894.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">σ 逐点落库</text><rect x="1010" y="90" width="160" height="70" rx="5" fill="#fff" stroke="#1e5a96" stroke-width="1.5"/><text x="1090.0" y="111.0" font-size="13" fill="#1a2b3c" text-anchor="middle" font-weight="600">⑥ 输出</text><text x="1090.0" y="126.0" font-size="10.5" fill="#556" text-anchor="middle">点云 + zMap</text><text x="1090.0" y="140.0" font-size="10" fill="#778" text-anchor="middle">冻结也发</text><line x1="192" y1="125" x2="224" y2="125" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><line x1="388" y1="125" x2="420" y2="125" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><line x1="584" y1="125" x2="616" y2="125" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><line x1="780" y1="125" x2="812" y2="125" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><line x1="976" y1="125" x2="1008" y2="125" stroke="#1e5a96" stroke-width="1.8" marker-end="url(#a)"/><text x="30" y="210" font-size="14" fill="#4a5a6b" text-anchor="start" font-weight="600">防御层（旁路开关，按状态启用）</text><rect x="30" y="228" width="180" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="120" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">D1 车身掩码</text><text x="120" y="267" font-size="10.5" fill="#556" text-anchor="middle">LUT 构建期剔除</text><text x="120" y="282" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="600">已接入</text><rect x="223" y="228" width="180" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="313" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">D3 FoE 锥</text><text x="313" y="267" font-size="10.5" fill="#556" text-anchor="middle">平移退化点过滤</text><text x="313" y="282" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="600">已接入</text><rect x="416" y="228" width="180" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="506" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">σ 硬截断</text><text x="506" y="267" font-size="10.5" fill="#556" text-anchor="middle">80cm，切 8m 外</text><text x="506" y="282" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="600">已接入</text><rect x="609" y="228" width="180" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="699" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">D4 交叉验证</text><text x="699" y="267" font-size="10.5" fill="#556" text-anchor="middle">双基线互检</text><text x="699" y="282" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="600">已接入</text><rect x="802" y="228" width="180" height="62" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="892" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">双基线状态机</text><text x="892" y="267" font-size="10.5" fill="#556" text-anchor="middle">长基线累积</text><text x="892" y="282" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="600">已接入</text><rect x="995" y="228" width="180" height="62" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/><text x="1085" y="250" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">D2 双向一致性</text><text x="1085" y="267" font-size="10.5" fill="#556" text-anchor="middle">反向匹配</text><text x="1085" y="282" font-size="10.5" fill="#e65100" text-anchor="middle" font-weight="600">未接入</text><line x1="600" y1="162" x2="600" y2="222" stroke="#93a4b5" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="600.0" y="186.0" font-size="10.5" fill="#93a4b5" text-anchor="middle">旁路</text><text x="30" y="336" font-size="14" fill="#4a5a6b" text-anchor="start" font-weight="600">门控状态机</text><rect x="30" y="352" width="270" height="52" rx="6" fill="#fdecea" stroke="#4a5a6b" stroke-width="1.2"/><text x="165" y="374" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">FROZEN_NEAR</text><text x="165" y="390" font-size="10.5" fill="#556" text-anchor="middle">b < 278mm</text><rect x="322" y="352" width="270" height="52" rx="6" fill="#e8f5e9" stroke="#4a5a6b" stroke-width="1.2"/><text x="457" y="374" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">STEREO</text><text x="457" y="390" font-size="10.5" fill="#556" text-anchor="middle">278~833mm</text><rect x="614" y="352" width="270" height="52" rx="6" fill="#fdecea" stroke="#4a5a6b" stroke-width="1.2"/><text x="749" y="374" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">FROZEN_ROT</text><text x="749" y="390" font-size="10.5" fill="#556" text-anchor="middle">航向漂移>15°</text><rect x="906" y="352" width="270" height="52" rx="6" fill="#fdecea" stroke="#4a5a6b" stroke-width="1.2"/><text x="1041" y="374" font-size="12" fill="#1a2b3c" text-anchor="middle" font-weight="600">FROZEN_FAR</text><text x="1041" y="390" font-size="10.5" fill="#556" text-anchor="middle">b > 833mm</text><text x="30" y="452" font-size="14" fill="#4a5a6b" text-anchor="start" font-weight="600">实测耗时构成（34.0 ms/帧，含 4 路）</text><rect x="30" y="466" width="235.2941176470588" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="147.6470588235294" y="484" font-size="10.5" fill="#1a3d5f" text-anchor="middle">视口 LUT 8ms</text><rect x="268.2941176470588" y="466" width="529.4117647058823" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="533.0" y="484" font-size="10.5" fill="#1a3d5f" text-anchor="middle">SGBM 18ms</text><rect x="800.7058823529411" y="466" width="117.6470588235294" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="859.5294117647059" y="484" font-size="10.5" fill="#1a3d5f" text-anchor="middle">三角化 4ms</text><rect x="921.3529411764705" y="466" width="88.23529411764706" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="965.470588235294" y="484" font-size="10.5" fill="#1a3d5f" text-anchor="middle">体素融合 3ms</text><rect x="1012.5882352941176" y="466" width="29.41176470588235" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="30" y="512" font-size="11.5" fill="#666" text-anchor="start">合计约 34 ms，占 200 ms 预算的 17%。6 视口全开需并行，否则线性放大。</text><rect x="30" y="536" width="1140" height="86" rx="8" fill="#fffbea" stroke="#e0c060" stroke-width="1.2"/><text x="48" y="560" font-size="13" fill="#8a6d00" text-anchor="start" font-weight="600">当前瓶颈（已定位）</text><text x="48" y="582" font-size="11" fill="#6b5300" text-anchor="start">· depth_accuracy 失败：合成场景只有地面+一面墙，探针样本全落在 776mm 近场地面，该段无水平结构可匹配</text><text x="48" y="597" font-size="11" fill="#6b5300" text-anchor="start">· 真实数据 195 点/帧：点密度不足，聚类聚不出物体（82 簇、每簇 4 点），根因同上</text><text x="48" y="612" font-size="11" fill="#6b5300" text-anchor="start">· 150 mm @ 5 m 未证实：需 σ_d ≤ 0.34 px，SGBM 典型值 0.3-0.5 px，属理论边界</text></svg>