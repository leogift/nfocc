e9" stroke="#5a6b7d" stroke-width="1.2"/><text x="447" y="394" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">STEREO</text><text x="447" y="412" font-size="10.5" fill="#556" text-anchor="middle">短/长基线</text><text x="447" y="425" font-size="10.5" fill="#556" text-anchor="middle">278 ~ 833 mm</text><rect x="600" y="372" width="265" height="58" rx="6" fill="#fdecea" stroke="#5a6b7d" stroke-width="1.2"/><text x="732" y="394" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">FROZEN_ROT</text><text x="732" y="412" font-size="10.5" fill="#556" text-anchor="middle">航向漂移</text><text x="732" y="425" font-size="10.5" fill="#556" text-anchor="middle">> 15°</text><rect x="885" y="372" width="265" height="58" rx="6" fill="#fdecea" stroke="#5a6b7d" stroke-width="1.2"/><text x="1017" y="394" font-size="12.5" fill="#1a2b3c" text-anchor="middle" font-weight="600">FROZEN_FAR</text><text x="1017" y="412" font-size="10.5" fill="#556" text-anchor="middle">基线过大</text><text x="1017" y="425" font-size="10.5" fill="#556" text-anchor="middle">b > 833 mm</text><text x="30" y="490" font-size="14" fill="#5a6b7d" text-anchor="start" font-weight="600">时序预算（实测，单相机串行 35.6 ms/帧）</text><rect x="30" y="505" width="222.2222222222222" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="141.1111111111111" y="523" font-size="10.5" fill="#1a3d5f" text-anchor="middle">视口 LUT 8ms</text><rect x="255.2222222222222" y="505" width="500.0" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="505.2222222222222" y="523" font-size="10.5" fill="#1a3d5f" text-anchor="middle">SGBM 18ms</text><rect x="758.2222222222222" y="505" width="111.1111111111111" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="813.7777777777777" y="523" font-size="10.5" fill="#1a3d5f" text-anchor="middle">三角化 4ms</text><rect x="872.3333333333333" y="505" width="138.88888888888889" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="941.7777777777777" y="523" font-size="10.5" fill="#1a3d5f" text-anchor="middle">体素 5ms</text><rect x="1014.2222222222222" y="505" width="27.777777777777775" height="26" fill="#cfe3f5" stroke="#3a6ea5" stroke-width="1"/><text x="30" y="552" font-size="11.5" fill="#666" text-anchor="start">合计约 36 ms，占 200 ms 预算的 18%。6 视口全开需并行，否则线性放大。</text><rect x="30" y="578" width="1120" height="94" rx="8" fill="#fffbea" stroke="#e0c060" stroke-width="1.2"/><text x="48" y="602" font-size="13" fill="#8a6d00" text-anchor="start" font-weight="600">当前阻塞</text><text x="48" y="624" font-size="11.5" fill="#6b5300" text-anchor="start">· depth_accuracy 失败：合成场景只有地面 + 一面墙，纹理规则周期，SGBM 锁错周期（墙面理论 140.8px 实测 2.2px）</text><text x="48" y="640" font-size="11.5" fill="#6b5300" text-anchor="start">· 聚类受限：帧 164 仅 1256 点 → 82 簇、噪声 926、每簇 4 点。密度不足以聚出物体，根因同上</text><text x="48" y="656" font-size="11.5" fill="#6b5300" text-anchor="start">· 150mm@5m 未证实：需 σ_d ≤ 0.34px，SGBM 典型值 0.3-0.5px，理论边界</text></svg>