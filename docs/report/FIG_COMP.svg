<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><rect width="1200" height="560" fill="#ffffff"/><style>text{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#456"/></marker></defs><text x="30" y="36" font-size="20" fill="#1a2b3c" text-anchor="start" font-weight="600">图 4  功能完整度</text><text x="30" y="104" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">几何与相机</text><rect x="200" y="90" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="90" width="600" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="104" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">100%</text><text x="860" y="104" font-size="10.5" fill="#667" text-anchor="start">视口 / 相机模型 / 三角化 全部完成</text><text x="30" y="148" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">体素与融合</text><rect x="200" y="134" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="134" width="600" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="148" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">100%</text><text x="860" y="148" font-size="10.5" fill="#667" text-anchor="start">Hash+CMA / σ 传播 / 五阶段精简</text><text x="30" y="192" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">防御体系</text><rect x="200" y="178" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="178" width="498" height="20" rx="3" fill="#e65100" opacity="0.85"/><text x="812" y="192" font-size="12" fill="#e65100" text-anchor="start" font-weight="600">83%</text><text x="860" y="192" font-size="10.5" fill="#667" text-anchor="start">D1/D3/D4/σ 完成，D2 未接入主链</text><text x="30" y="236" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">基线决策</text><rect x="200" y="222" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="222" width="600" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="236" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">100%</text><text x="860" y="236" font-size="10.5" fill="#667" text-anchor="start">双基线状态机 + 里程计积分</text><text x="30" y="280" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">IO 与协议</text><rect x="200" y="266" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="266" width="540" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="280" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">90%</text><text x="860" y="280" font-size="10.5" fill="#667" text-anchor="start">ZMQ 零拷贝完成，ICD 尺寸白名单已修</text><text x="30" y="324" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">聚类与动静分离</text><rect x="200" y="310" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="310" width="600" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="324" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">100%</text><text x="860" y="324" font-size="10.5" fill="#667" text-anchor="start">网格哈希 + DBSCAN + 投票</text><text x="30" y="368" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">测试覆盖</text><rect x="200" y="354" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="354" width="570" height="20" rx="3" fill="#2e7d32" opacity="0.85"/><text x="812" y="368" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="600">95%</text><text x="860" y="368" font-size="10.5" fill="#667" text-anchor="start">20/21 通过，depth_accuracy 失败</text><text x="30" y="412" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">精度验证</text><rect x="200" y="398" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="398" width="180" height="20" rx="3" fill="#c62828" opacity="0.85"/><text x="812" y="412" font-size="12" fill="#c62828" text-anchor="start" font-weight="600">30%</text><text x="860" y="412" font-size="10.5" fill="#667" text-anchor="start">场景不适合，样本全在近场地面</text><text x="30" y="456" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">跨平台</text><rect x="200" y="442" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="442" width="360" height="20" rx="3" fill="#e65100" opacity="0.85"/><text x="812" y="456" font-size="12" fill="#e65100" text-anchor="start" font-weight="600">60%</text><text x="860" y="456" font-size="10.5" fill="#667" text-anchor="start">macOS/Linux/aarch64 可编，Windows 未做</text><text x="30" y="500" font-size="12.5" fill="#1a2b3c" text-anchor="start" font-weight="600">真机部署</text><rect x="200" y="486" width="600" height="20" rx="3" fill="#eef1f4" stroke="#dde3e8"/><rect x="200" y="486" width="120" height="20" rx="3" fill="#c62828" opacity="0.85"/><text x="812" y="500" font-size="12" fill="#c62828" text-anchor="start" font-weight="600">20%</text><text x="860" y="500" font-size="10.5" fill="#667" text-anchor="start">产物已出，未运行</text><rect x="30" y="490" width="1140" height="52" rx="6" fill="#f0f7ff" stroke="#9cc" stroke-width="1.1"/><text x="46" y="512" font-size="13" fill="#1e5a96" text-anchor="start" font-weight="600">整体判断：链路已打通，精度未证实。</text><text x="46" y="530" font-size="11" fill="#334" text-anchor="start">端到端能跑出点云，但「点有多准」还没有可信测量 —— 唯一测精度的用例失败，且失败原因在测试场景而非算法。</text></svg>