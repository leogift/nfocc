<text x="764.0" y="416.0" font-size="12.5" fill="#7a3b33" text-anchor="start">150 mm 不是调参能解决的。</text>
<text x="30.0" y="462.0" font-size="12.5" fill="#8794a3" text-anchor="start">帧间位移 b = v/(5 Hz)；σ_d 取 0.5 px 是 SGBM 的典型值，非本项目实测。误差按 Z² 增长，是几何决定的。</text>
<text x="30.0" y="484.0" font-size="12.5" fill="#8794a3" text-anchor="start">里程计项 σ_b=2% 未计入；计入后远距离误差更大。</text>
</svg>
