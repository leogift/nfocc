<text x="24.0" y="394.0" font-size="12.5" fill="#8794a3" text-anchor="start">断言总数 = 20 个目标的 2,313 次 + depth_accuracy 的 21 次。「通过」不等于需求满足：D2 未接入、精度未达标都不体现在失败数里。</text>
